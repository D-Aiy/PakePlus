<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计数器</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --primary: #5b6af0;
            --primary-hover: #4a56d4;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --success: #27ae60;
            --success-hover: #1e8449;
            --border: #e0e4e8;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #e8ecf1 0%, #dce3ea 30%, #eef1f5 60%, #e3e8f0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            right: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(91, 106, 240, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(39, 174, 96, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            transition: all var(--transition);
        }

        /* 标题 */
        .header {
            margin-bottom: 8px;
        }
        .header .icon {
            display: inline-block;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #5b6af0 0%, #7c8cf8 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(91, 106, 240, 0.25);
        }
        .header .icon svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 计数值显示区域 */
        .counter-display {
            margin: 28px 0 20px;
            position: relative;
        }
        .counter-value-wrapper {
            display: inline-block;
            position: relative;
            padding: 20px 40px;
            background: #f8fafc;
            border-radius: var(--radius);
            border: 2px dashed var(--border);
            min-width: 180px;
            transition: all var(--transition);
        }
        .counter-value-wrapper.pulse {
            animation: pulseBorder 0.5s ease-out;
        }
        @keyframes pulseBorder {
            0% {
                border-color: var(--primary);
                box-shadow: 0 0 0 0 rgba(91, 106, 240, 0.4);
            }
            100% {
                border-color: var(--border);
                box-shadow: 0 0 0 20px rgba(91, 106, 240, 0);
            }
        }
        .counter-value {
            font-size: 5rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.03em;
            line-height: 1;
            transition: transform 0.15s ease-out, color var(--transition);
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', 'PingFang SC', monospace;
        }
        .counter-value.positive {
            color: var(--success);
        }
        .counter-value.negative {
            color: var(--danger);
        }
        .counter-value.zero {
            color: var(--text);
        }
        .counter-value.pop {
            animation: popNumber 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popNumber {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.18);
            }
            100% {
                transform: scale(1);
            }
        }

        /* 步长设置 */
        .step-setting {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .step-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            white-space: nowrap;
        }
        .step-presets {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .step-preset {
            padding: 7px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
            font-family: inherit;
        }
        .step-preset:hover {
            border-color: #c0c7d0;
            background: #f5f6f8;
        }
        .step-preset.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(91, 106, 240, 0.3);
        }
        .step-custom {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .step-custom input {
            width: 58px;
            padding: 7px 8px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            text-align: center;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
            background: #fff;
            transition: all var(--transition);
            font-family: inherit;
        }
        .step-custom input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 106, 240, 0.1);
        }

        /* 按钮区 */
        .button-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 28px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-decrement {
            background: #fff;
            color: var(--danger);
            border: 2px solid var(--danger);
            box-shadow: 0 2px 10px rgba(231, 76, 60, 0.1);
        }
        .btn-decrement:hover {
            background: #fef5f5;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.2);
        }
        .btn-decrement:active {
            background: #fde8e8;
        }
        .btn-increment {
            background: var(--primary);
            color: #fff;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 16px rgba(91, 106, 240, 0.3);
        }
        .btn-increment:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: 0 8px 28px rgba(91, 106, 240, 0.4);
        }
        .btn-reset {
            background: #fff;
            color: var(--text-secondary);
            border: 2px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .btn-reset:hover {
            background: #f5f6f8;
            border-color: #c0c7d0;
            color: var(--text);
        }
        .btn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .quick-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #fafbfc;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
            font-family: inherit;
        }
        .quick-btn:hover {
            background: #f0f2f5;
            border-color: #c0c7d0;
            color: var(--text);
        }

        /* 历史记录 */
        .history-section {
            margin-top: 24px;
            text-align: left;
            border-top: 1px solid var(--border);
            padding-top: 18px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .history-header span {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text);
        }
        .history-clear {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            transition: all var(--transition);
            font-family: inherit;
        }
        .history-clear:hover {
            background: #fef5f5;
            color: var(--danger);
        }
        .history-list {
            max-height: 160px;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .history-list::-webkit-scrollbar {
            width: 4px;
        }
        .history-list::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 4px;
        }
        .history-list::-webkit-scrollbar-thumb {
            background: #dce0e5;
            border-radius: 4px;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: #f8fafc;
            font-size: 0.85rem;
            color: var(--text);
            animation: slideIn 0.25s ease-out;
            transition: background var(--transition);
        }
        .history-item:hover {
            background: #f0f4f8;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .history-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .history-badge.inc {
            background: #e8f8ef;
            color: var(--success);
        }
        .history-badge.dec {
            background: #fef0ee;
            color: var(--danger);
        }
        .history-badge.reset-badge {
            background: #f0f2f5;
            color: var(--text-secondary);
        }
        .history-time {
            margin-left: auto;
            font-size: 0.7rem;
            color: #b0b8c0;
            flex-shrink: 0;
        }
        .no-history {
            text-align: center;
            color: #c0c7d0;
            font-size: 0.8rem;
            padding: 16px 0;
        }

        /* 键盘提示 */
        .keyboard-hint {
            margin-top: 18px;
            font-size: 0.7rem;
            color: #c0c7d0;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .keyboard-hint kbd {
            display: inline-block;
            background: #f0f2f5;
            border: 1px solid #dce0e5;
            border-radius: 5px;
            padding: 2px 7px;
            font-size: 0.7rem;
            font-family: inherit;
            color: #8899a6;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .container {
                padding: 28px 18px 22px;
                border-radius: 16px;
            }
            .counter-value {
                font-size: 3.8rem;
            }
            .counter-value-wrapper {
                padding: 14px 28px;
                min-width: 140px;
            }
            .btn {
                padding: 12px 20px;
                font-size: 0.9rem;
            }
            .btn svg {
                width: 18px;
                height: 18px;
            }
            .button-row {
                gap: 8px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <div class="icon">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l4.59-4.58L18 11l-6 6z"/></svg>
            </div>
            <h1>计数器</h1>
            <p class="subtitle">点击按钮或使用键盘操作</p>
        </div>

        <!-- 数值显示 -->
        <div class="counter-display">
            <div class="counter-value-wrapper" id="valueWrapper">
                <span class="counter-value zero" id="counterValue">0</span>
            </div>
        </div>

        <!-- 步长设置 -->
        <div class="step-setting">
            <span class="step-label">步长</span>
            <div class="step-presets" id="stepPresets">
                <button class="step-preset active" data-step="1">1</button>
                <button class="step-preset" data-step="5">5</button>
                <button class="step-preset" data-step="10">10</button>
                <button class="step-preset" data-step="100">100</button>
            </div>
            <div class="step-custom">
                <input type="number" id="customStep" placeholder="自定义" min="0" value="" title="自定义步长">
            </div>
        </div>

        <!-- 主要按钮 -->
        <div class="button-row">
            <button class="btn btn-decrement" id="btnDecrement" title="减少 (快捷键: ↓ 或 -)">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="16" height="2" rx="1"/></svg>
                减少
            </button>
            <button class="btn btn-reset" id="btnReset" title="归零 (快捷键: R)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                归零
            </button>
            <button class="btn btn-increment" id="btnIncrement" title="增加 (快捷键: ↑ 或 +)">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="11" y="4" width="2" height="16" rx="1"/><rect x="4" y="11" width="16" height="2" rx="1"/></svg>
                增加
            </button>
        </div>

        <!-- 快捷操作 -->
        <div class="quick-actions">
            <button class="quick-btn" data-quick="double">×2 翻倍</button>
            <button class="quick-btn" data-quick="half">÷2 减半</button>
            <button class="quick-btn" data-quick="negate">± 取反</button>
            <button class="quick-btn" data-quick="set0">设为 0</button>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
            <div class="history-header">
                <span>📋 操作记录</span>
                <button class="history-clear" id="clearHistory">清空</button>
            </div>
            <ul class="history-list" id="historyList">
                <li class="no-history">暂无记录</li>
            </ul>
        </div>

        <!-- 键盘提示 -->
        <div class="keyboard-hint">
            <span><kbd>↑</kbd> / <kbd>+</kbd> 增加</span>
            <span><kbd>↓</kbd> / <kbd>-</kbd> 减少</span>
            <span><kbd>R</kbd> 归零</span>
            <span><kbd>Space</kbd> 增加</span>
        </div>
    </div>

    <script>
        (function() {
            // ============ DOM 元素 ============
            const counterValueEl = document.getElementById('counterValue');
            const valueWrapper = document.getElementById('valueWrapper');
            const btnIncrement = document.getElementById('btnIncrement');
            const btnDecrement = document.getElementById('btnDecrement');
            const btnReset = document.getElementById('btnReset');
            const stepPresetsContainer = document.getElementById('stepPresets');
            const customStepInput = document.getElementById('customStep');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistory');
            const quickBtns = document.querySelectorAll('.quick-btn');
            const noHistoryItem = historyList.querySelector('.no-history');

            // ============ 状态 ============
            let count = 0;
            let step = 1;
            let history = [];
            const MAX_HISTORY = 50;

            // ============ 初始化 ============
            function init() {
                // 从 localStorage 加载
                const savedCount = localStorage.getItem('counter_value');
                const savedStep = localStorage.getItem('counter_step');
                const savedHistory = localStorage.getItem('counter_history');

                if (savedCount !== null && !isNaN(Number(savedCount))) {
                    count = Number(savedCount);
                }
                if (savedStep !== null && !isNaN(Number(savedStep)) && Number(savedStep) > 0) {
                    step = Number(savedStep);
                    // 更新步长UI
                    const presetBtn = stepPresetsContainer.querySelector(`[data-step="${step}"]`);
                    if (presetBtn) {
                        updateStepPresetUI(presetBtn);
                    } else {
                        updateStepPresetUI(null);
                        customStepInput.value = step;
                    }
                }
                if (savedHistory) {
                    try {
                        history = JSON.parse(savedHistory);
                    } catch (e) {
                        history = [];
                    }
                }

                updateDisplay(false);
                renderHistory();
            }

            function saveState() {
                localStorage.setItem('counter_value', count);
                localStorage.setItem('counter_step', step);
                localStorage.setItem('counter_history', JSON.stringify(history));
            }

            // ============ 显示更新 ============
            function updateDisplay(animate = true) {
                // 更新数字
                counterValueEl.textContent = count;

                // 更新颜色类
                counterValueEl.classList.remove('positive', 'negative', 'zero', 'pop');
                if (count > 0) {
                    counterValueEl.classList.add('positive');
                } else if (count < 0) {
                    counterValueEl.classList.add('negative');
                } else {
                    counterValueEl.classList.add('zero');
                }

                // 弹跳动画
                if (animate) {
                    void counterValueEl.offsetWidth; // 强制回流
                    counterValueEl.classList.add('pop');
                    valueWrapper.classList.remove('pulse');
                    void valueWrapper.offsetWidth;
                    valueWrapper.classList.add('pulse');
                }
            }

            // ============ 步长管理 ============
            function updateStepPresetUI(activeBtn) {
                const allPresets = stepPresetsContainer.querySelectorAll('.step-preset');
                allPresets.forEach(b => b.classList.remove('active'));
                if (activeBtn) {
                    activeBtn.classList.add('active');
                    customStepInput.value = '';
                }
            }

            stepPresetsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.step-preset');
                if (!btn) return;
                const newStep = Number(btn.dataset.step);
                if (isNaN(newStep) || newStep <= 0) return;
                step = newStep;
                updateStepPresetUI(btn);
                customStepInput.value = '';
                saveState();
            });

            customStepInput.addEventListener('input', () => {
                const val = Number(customStepInput.value);
                if (!isNaN(val) && val > 0) {
                    step = val;
                    updateStepPresetUI(null);
                    saveState();
                }
            });
            customStepInput.addEventListener('change', () => {
                const val = Number(customStepInput.value);
                if (isNaN(val) || val <= 0) {
                    customStepInput.value = step;
                }
            });
            // 也监听 blur
            customStepInput.addEventListener('blur', () => {
                const val = Number(customStepInput.value);
                if (isNaN(val) || val <= 0) {
                    customStepInput.value = step;
                } else {
                    step = val;
                    updateStepPresetUI(null);
                    saveState();
                }
            });

            // ============ 计数操作 ============
            function addToHistory(type, delta = 0) {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' });
                history.unshift({
                    type, // 'inc' | 'dec' | 'reset' | 'double' | 'half' | 'negate' | 'set0'
                    delta,
                    from: type === 'inc' ? count - delta : (type === 'dec' ? count + Math.abs(delta) : count),
                    to: count,
                    time: timeStr,
                    id: Date.now() + Math.random()
                });
                if (history.length > MAX_HISTORY) {
                    history = history.slice(0, MAX_HISTORY);
                }
                saveState();
                renderHistory();
            }

            function increment() {
                const oldCount = count;
                count += step;
                updateDisplay(true);
                addToHistory('inc', step);
            }

            function decrement() {
                const oldCount = count;
                count -= step;
                updateDisplay(true);
                addToHistory('dec', step);
            }

            function reset() {
                if (count === 0) return; // 已经是0就不记录
                const oldCount = count;
                count = 0;
                updateDisplay(true);
                addToHistory('reset', oldCount);
            }

            function doubleCount() {
                if (count === 0) return;
                const oldCount = count;
                count *= 2;
                updateDisplay(true);
                addToHistory('double', oldCount);
            }

            function halfCount() {
                if (count === 0) return;
                const oldCount = count;
                count = Math.floor(count / 2);
                updateDisplay(true);
                addToHistory('half', oldCount);
            }

            function negateCount() {
                if (count === 0) return;
                const oldCount = count;
                count = -count;
                updateDisplay(true);
                addToHistory('negate', oldCount);
            }

            function setToZero() {
                if (count === 0) return;
                const oldCount = count;
                count = 0;
                updateDisplay(true);
                addToHistory('set0', oldCount);
            }

            // ============ 按钮事件 ============
            btnIncrement.addEventListener('click', increment);
            btnDecrement.addEventListener('click', decrement);
            btnReset.addEventListener('click', reset);

            quickBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.dataset.quick;
                    switch (action) {
                        case 'double':
                            doubleCount();
                            break;
                        case 'half':
                            halfCount();
                            break;
                        case 'negate':
                            negateCount();
                            break;
                        case 'set0':
                            setToZero();
                            break;
                    }
                });
            });

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', (e) => {
                // 如果焦点在输入框中，不拦截（但允许空格等）
                const tag = document.activeElement.tagName.toLowerCase();
                const isInputFocused = (tag === 'input' || tag === 'textarea' || tag === 'select' ||
                    document.activeElement.isContentEditable);

                // 对于 R 键和 Escape，即使在输入框中也响应（但需谨慎）
                // 对于方向键和加减号，如果在输入框中则不响应
                if (isInputFocused && !['KeyR', 'Escape'].includes(e.code)) {
                    // 在输入框中，只响应 Escape 退出焦点
                    if (e.code === 'Escape') {
                        document.activeElement.blur();
                    }
                    return;
                }

                switch (e.code) {
                    case 'ArrowUp':
                    case 'Equal': // + 键（需要Shift）
                    case 'NumpadAdd':
                        e.preventDefault();
                        increment();
                        break;
                    case 'ArrowDown':
                    case 'Minus': // - 键
                    case 'NumpadSubtract':
                        e.preventDefault();
                        decrement();
                        break;
                    case 'Space':
                        e.preventDefault();
                        increment();
                        break;
                    case 'KeyR':
                        e.preventDefault();
                        reset();
                        break;
                    case 'Escape':
                        e.preventDefault();
                        reset();
                        break;
                    case 'Digit0':
                    case 'Numpad0':
                        if (e.ctrlKey || e.metaKey) {
                            e.preventDefault();
                            setToZero();
                        }
                        break;
                    default:
                        break;
                }
            });

            // ============ 历史记录渲染 ============
            function renderHistory() {
                if (history.length === 0) {
                    historyList.innerHTML = '<li class="no-history">暂无记录</li>';
                    return;
                }
                historyList.innerHTML = history.map(h => {
                    let badgeText = '';
                    let badgeClass = '';
                    let desc = '';
                    switch (h.type) {
                        case 'inc':
                            badgeText = '+';
                            badgeClass = 'inc';
                            desc = `增加 ${h.delta} → ${h.to}`;
                            break;
                        case 'dec':
                            badgeText = '−';
                            badgeClass = 'dec';
                            desc = `减少 ${h.delta} → ${h.to}`;
                            break;
                        case 'reset':
                            badgeText = '⟳';
                            badgeClass = 'reset-badge';
                            desc = `从 ${h.from} 归零`;
                            break;
                        case 'double':
                            badgeText = '×2';
                            badgeClass = 'inc';
                            desc = `翻倍: ${h.from} → ${h.to}`;
                            break;
                        case 'half':
                            badgeText = '÷2';
                            badgeClass = 'dec';
                            desc = `减半: ${h.from} → ${h.to}`;
                            break;
                        case 'negate':
                            badgeText = '±';
                            badgeClass = 'reset-badge';
                            desc = `取反: ${h.from} → ${h.to}`;
                            break;
                        case 'set0':
                            badgeText = '0';
                            badgeClass = 'reset-badge';
                            desc = `设为0: 从 ${h.from}`;
                            break;
                        default:
                            badgeText = '•';
                            badgeClass = 'reset-badge';
                            desc = `${h.to}`;
                    }
                    return `
                                <li class="history-item">
                                    <span class="history-badge ${badgeClass}">${badgeText}</span>
                                    <span>${desc}</span>
                                    <span class="history-time">${h.time}</span>
                                </li>
                            `;
                }).join('');
            }

            clearHistoryBtn.addEventListener('click', () => {
                history = [];
                saveState();
                renderHistory();
            });

            // ============ 启动 ============
            init();

            console.log('✅ 计数器已就绪');
            console.log('   🖱️ 点击按钮操作');
            console.log('   ⌨️  键盘快捷键: ↑↓ 增减, +/- 增减, 空格增加, R 归零');
            console.log('   💾 数据自动保存到浏览器本地存储');
        })();
    </script>
</body>
</html>
